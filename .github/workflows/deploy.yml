name: Deploy

on:
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]

  push:
    paths:
      - "app/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get running EC2 by tag
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=tf-lab-01" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running EC2 found (tf-lab-01)"
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Wait for SSM Document
        run: |
          timeout 30 bash -c '
            until aws ssm get-document --name DeployAppGithub >/dev/null 2>&1; do
              echo "Waiting for DeployAppGithub..."
              sleep 5
            done
          '

      - name: Deploy via SSM Document
        run: |
          aws ssm send-command \
            --document-name DeployAppGithub \
            --targets "Key=tag:Name,Values=tf-lab-01" \
            --comment "Deploy triggered by GitHub Actions"