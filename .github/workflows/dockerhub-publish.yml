name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate Docker image tag
        id: set-tag
        run: |
          # Contamos los commits en main para usar como versión incremental
          COUNT=$(git rev-list --count HEAD)
          IMAGE_TAG="v0.0.$COUNT"
          echo "Docker image tag: $IMAGE_TAG"
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag gustavobarrera/flaskapp:${{ steps.set-tag.outputs.image-tag }}

  push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the Docker image
        run: docker push gustavobarrera/flaskapp:${{ needs.build.outputs.image-tag }}